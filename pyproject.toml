[project]
name = "voicevox-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.2"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.8.0",
    "requests>=2.31.0",
]

[project.scripts]
voicevox-cli = "voicevox_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]
audio = [
    "simpleaudio>=1.0.4",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
